<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lexicon</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bar">
      <h1>Lexicon</h1>
      <div
        id="lex-status"
        class="lex-status"
        data-lex-status="checking"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        <img id="status-icon" class="status-icon" alt="" aria-hidden="true" />
        <p id="status" class="status">I’m checking…</p>
      </div>
    </header>

    <section class="settings" aria-label="Extension controls">
      <label class="toggle">
        <input id="pause-proofreading" type="checkbox" />
        <span>Pause proofreading</span>
      </label>
      <label class="toggle">
        <input id="disable-site" type="checkbox" />
        <span>Disable Lexicon on <strong id="site-name">this site</strong></span>
      </label>
      <p id="settings-status" class="settings-status" role="status"></p>
    </section>

    <section class="dictionary" aria-labelledby="dictionary-title">
      <div class="dictionary-heading">
        <h2 id="dictionary-title">Your Dictionary</h2>
        <span id="dictionary-count" class="dictionary-count"></span>
      </div>
      <p class="dictionary-help">
        Shared with the Lexicon desktop app. Words here are ignored by
        proofreading.
      </p>
      <div class="dictionary-add">
        <input
          id="dictionary-word"
          type="text"
          placeholder="Add a word…"
          aria-label="Add a word to the dictionary"
          maxlength="256"
        />
        <button id="dictionary-add-button" type="button">Add</button>
      </div>
      <p id="dictionary-status" class="dictionary-status" role="status"></p>
      <ul id="dictionary-list" class="dictionary-list"></ul>
      <p id="dictionary-empty" class="dictionary-empty">No words added yet.</p>
    </section>

    <p class="popup-help">
      Click a Lexicon badge beside a visible field to review issues. Hover it
      to reveal Tone.
    </p>

    <div class="legacy-ai" hidden>
      <div class="field-picker">
        <label for="field-select">Apply Tone to</label>
        <select id="field-select" aria-label="Text field target">
          <option value="">Choose a visible text field…</option>
        </select>
      </div>

      <textarea
        id="input"
        readonly
        placeholder="Choose a visible text field above to use Tone."
        spellcheck="false"
      ></textarea>

      <div class="actions">
        <button id="proofread" type="button">Proofread</button>
        <select id="rewrite-tool" aria-label="Rewrite style"></select>
        <button id="rewrite" type="button">Rewrite</button>
      </div>

      <div id="results" class="results" role="status" aria-live="polite"></div>
    </div>

    <footer class="footer">
      <a href="https://discord.gg/nDCedWH3SV" target="_blank" rel="noopener" class="footer-link">Report on Discord</a>
      <span class="footer-dot">&middot;</span>
      <a href="https://github.com/AashishH15/Lexicon/issues" target="_blank" rel="noopener" class="footer-link">GitHub Issues</a>
    </footer>

    <script src="vendor/browser-polyfill.min.js"></script>
    <script src="lexStatus.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
